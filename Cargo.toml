[workspace]
members = [
	"crates/hl-code",
	"crates/hl-code-derive",
	"crates/hl-ffi",
	"crates/hl-sys",
]

[package]
name = "hl-jit"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 WITH LLVM-exception"

[features]
default = ["hl-ffi"]
libffi = []

[dependencies]
backtrace = "0.3.74"
clap = { version = "4.5.31", features = ["derive"] }
cranelift = { version = "0.118.0", features = [
	"jit",
	"module",
	"native",
	"object",
] }
libloading = "0.8.6"
hl-code = { path = "crates/hl-code" }
hl-sys = { path = "crates/hl-sys" }
hl-ffi = { path = "crates/hl-ffi", optional = true }

[build-dependencies]
bindgen = "0.71.1"
cc = "1.2.16"
